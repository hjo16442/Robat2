name: AI Code Fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ai-code-fixer-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  fix:
    if: |
      github.event.issue.pull_request != null &&
      (github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ')) &&
      github.event.comment.user.type != 'Bot' &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)

    runs-on: ubuntu-latest

    steps:
      - name: Checkout AI fixer source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Checkout PR snapshot
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.repository.full_name }}
          ref: refs/pull/${{ github.event.issue.number }}/head
          path: target
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Build AI fixer
        run: mvn -B -q -DskipTests package

      - name: Run AI Code Fixer
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          TARGET_DIR: target
        run: mvn -B -q exec:java -Dexec.mainClass="Main"
